name: Deploy website to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy files over SSH
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail

          for name in CPANEL_HOST CPANEL_PORT CPANEL_USER CPANEL_SSH_KEY CPANEL_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure the $name repository secret before deploying."
              exit 1
            fi
          done

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$CPANEL_SSH_KEY" > "$HOME/.ssh/cpanel_deploy"
          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/cpanel_deploy" "$HOME/.ssh/known_hosts"

          # Files and folders to publish. Anything listed here that no longer exists is skipped,
          # so deleting a page can't break the deploy.
          wanted="index.html pages php favicon.png robots.txt sitemap.xml css js images data"
          paths=()
          for p in $wanted; do
            if git cat-file -e "HEAD:$p" 2>/dev/null; then paths+=("$p"); else echo "::warning::Skipping $p (not in the repository)"; fi
          done

          # Pages now live in pages/ and PHP in php/. Remove the copies left at the top level from before the move
          # (never config.php, which stays at the top level).
          OLD_FILES="sight-and-sound.html gigs.html shop.html about.html artwork.html events.html recordings.html services.html contact.html learn.html song.html 404.html contact.php midi.php track.php admin.php db.php"

          git archive --format=tar HEAD "${paths[@]}" \
            | gzip \
            | ssh \
                -i "$HOME/.ssh/cpanel_deploy" \
                -p "$CPANEL_PORT" \
                -o BatchMode=yes \
                -o StrictHostKeyChecking=yes \
                "$CPANEL_USER@$CPANEL_HOST" \
                "mkdir -p /home/reecemus/public_html && tar -xzf - -C /home/reecemus/public_html && cd /home/reecemus/public_html && rm -f $OLD_FILES"
